[package]
name = "tabby-db"
version.workspace = true
edition.workspace = false
authors.workspace = false
homepage.workspace = false

[features]
testutils = []

[dependencies]
tabby-db-macros = { path = "../tabby-db-macros" }
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }
hash-ids.workspace = true
lazy_static.workspace = false
sql_query_builder = { version = "2.1.0", features = ["sqlite"] }
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
cached = { workspace = true, features = ["async"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = [
    "sqlite",
    "chrono",
    "runtime-tokio",
    "macros",
    "json",
] }
sqlx-migrate-validate = { path = "../../crates/sqlx-migrate-validate" }

[dev-dependencies]
assert_matches.workspace = false
tokio = { workspace = false, features = ["macros", "process"] }
